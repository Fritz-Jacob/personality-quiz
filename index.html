<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personality Quiz</title>
    <link rel="icon" type="image/x-icon" href="/img/ideas.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href ="./css/style.css">
</head>
<body>

    <h1 class="text-center mt-4">Which Superhero Are You?</h1>


    <!-- Question 1 -->
    <div class="container d-flex justify-content-center" id="question-1">

        <div class="card my-4 p-4 question-block" style="width: 75%;">

            <h4 class="mb-3">
                1. Your friends are in trouble. What do you do?
            </h4>

            <div class="row g-2">

                <div class="col-6">
                    <button
                        class="btn btn-outline-primary w-100 answer-btn"
                        data-answer="A">
                        Come up with a plan before doing anything
                    </button>
                </div>

                <div class="col-6">
                    <button
                        class="btn btn-outline-primary w-100 answer-btn"
                        data-answer="B">
                        Jump in and figure it out as I go
                    </button>
                </div>

                <div class="col-6">
                    <button
                        class="btn btn-outline-primary w-100 answer-btn"
                        data-answer="C">
                        Immediately help and protect everyone
                    </button>
                </div>

                <div class="col-6">
                    <button
                        class="btn btn-outline-primary w-100 answer-btn"
                        data-answer="D">
                        Create a clever solution to fix the problem
                    </button>
                </div>

            </div>
        </div>
    </div>


    <!-- Question 2 -->
    <div class="container d-flex justify-content-center" id="question-2">

        <div class="card my-4 p-4 question-block" style="width: 75%;">

            <h4 class="mb-3">
                2. What is your greatest strength?
            </h4>

            <div class="row g-2">

                <div class="col-6">
                    <button
                        class="btn btn-outline-primary w-100 answer-btn"
                        data-answer="A">
                        Intelligence and strategy
                    </button>
                </div>

                <div class="col-6">
                    <button
                        class="btn btn-outline-primary w-100 answer-btn"
                        data-answer="B">
                        Humor and adaptability
                    </button>
                </div>

                <div class="col-6">
                    <button
                        class="btn btn-outline-primary w-100 answer-btn"
                        data-answer="C">
                        Courage and loyalty
                    </button>
                </div>

                <div class="col-6">
                    <button
                        class="btn btn-outline-primary w-100 answer-btn"
                        data-answer="D">
                        Creativity and confidence
                    </button>
                </div>

            </div>
        </div>
    </div>


    <!-- Question 3 -->
    <div class="container d-flex justify-content-center" id="question-3">

        <div class="card my-4 p-4 question-block" style="width: 75%;">

            <h4 class="mb-3">
                3. Pick your ideal way to spend a free night.
            </h4>

            <div class="row g-2">

                <div class="col-6">
                    <button
                        class="btn btn-outline-primary w-100 answer-btn"
                        data-answer="A">
                        Working alone on something important
                    </button>
                </div>

                <div class="col-6">
                    <button
                        class="btn btn-outline-primary w-100 answer-btn"
                        data-answer="B">
                        Hanging out with friends and having fun
                    </button>
                </div>

                <div class="col-6">
                    <button
                        class="btn btn-outline-primary w-100 answer-btn"
                        data-answer="C">
                        Spending time with people I care about
                    </button>
                </div>

                <div class="col-6">
                    <button
                        class="btn btn-outline-primary w-100 answer-btn"
                        data-answer="D">
                        Working on a new project or idea
                    </button>
                </div>

            </div>
        </div>
    </div>


    <!-- Question 4 -->
    <div class="container d-flex justify-content-center" id="question-4">

        <div class="card my-4 p-4 question-block" style="width: 75%;">

            <h4 class="mb-3">
                4. How would your friends describe you?
            </h4>

            <div class="row g-2">

                <div class="col-6">
                    <button
                        class="btn btn-outline-primary w-100 answer-btn"
                        data-answer="A">
                        Quiet and calculated
                    </button>
                </div>

                <div class="col-6">
                    <button
                        class="btn btn-outline-primary w-100 answer-btn"
                        data-answer="B">
                        Funny and energetic
                    </button>
                </div>

                <div class="col-6">
                    <button
                        class="btn btn-outline-primary w-100 answer-btn"
                        data-answer="C">
                        Reliable and kind
                    </button>
                </div>

                <div class="col-6">
                    <button
                        class="btn btn-outline-primary w-100 answer-btn"
                        data-answer="D">
                        Confident and ambitious
                    </button>
                </div>

            </div>
        </div>
    </div>


    <!-- Show Results Button -->
    <div class="container d-flex justify-content-center">

        <button
            id="show-result"
            class="btn btn-success my-4">

            Show Results

        </button>

    </div>


    <!-- Result -->
    <div class="container d-flex justify-content-center">

        <div
            id="result-container"
            class="card p-4 mb-4"
            style="width: 75%; display: none;">

            <h3>Your Result:</h3>

            <p id="result-text"></p>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="./js/script.js"></script>

</body>

</html>
